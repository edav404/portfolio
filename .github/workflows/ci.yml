# CI (DX-01): typecheck, lint, tests unitarios y build de producción.
# El despliegue NO pasa por aquí: lo hace Coolify con el Dockerfile (docs/despliegue-coolify.md).
name: CI

on:
  push:
    branches: [main, "fase/**"]
  pull_request:
    branches: [main, "fase/**"]

# Mínimo privilegio: el workflow solo lee el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama/PR cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Typecheck, lint, test y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA (Dependabot las actualiza; el comentario indica la versión).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      # Sin secretos: NEXT_PUBLIC_SITE_URL cae en https://edav.com.co y Last.fm/SMTP solo se usan en runtime.
      - name: Build
        run: npm run build
